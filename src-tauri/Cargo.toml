[package]
name = "split-proxy-island"
version = "0.1.0"
edition = "2021"
license = "MIT"

[lib]
name = "split_proxy_island_lib"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "image-png"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sysproxy = "0.3"
